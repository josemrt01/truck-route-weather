services:
  - type: web
    name: truck-route-weather
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn config.wsgi --workers 1 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
